# DOCUMENTATION ONLY — enforcement lives in docker-compose.yaml.
# Editing this file does NOT change container behavior. (eng-review L5 P3-1)
#
# This file documents the mount allowlist intent for human reviewers.
# The compose file is the single source of truth for what is actually mounted.
# kayaclaw principle: the agent only sees what is *explicitly* mounted.

# Required mounts — every deploy gets these.
required:
  - source: ./config.yaml
    target: /config/config.yaml
    mode: ro                    # read-only — agent cannot tamper with its own policy
  - source: agent-data          # named docker volume
    target: /data
    mode: rw                    # writable, but isolated (no host bind)

# Tmpfs (in-memory, ephemeral) — needed because the root FS is read-only.
tmpfs:
  - target: /tmp
    mode: "1777"                # stdlib tempfile + HOME=/tmp redirects

# What is NEVER mounted. Encoded as a denylist hint for review.
forbidden:
  - /var/run/docker.sock        # would grant container escape
  - /                           # the host root
  - /home                       # all home directories
  - /etc                        # host config
  - ~/.ssh                      # host SSH keys
  - ~/.aws                      # cloud credentials
  - ~/.config                   # user configs (often hold tokens)

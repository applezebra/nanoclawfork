# kayaclaw 0.1.6: three-service compose. The compose file IS the security
# enforcement point: read-only root FS, dropped capabilities, no-new-privileges,
# explicit mount allowlist, resource limits, and egress allowlist via the
# proxy sidecar (SECURITY.md control 10b).

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # init: one-shot. Renders the egress allowlist from config.yaml onto the
  # shared named volume that the proxy sidecar reads at start.
  init:
    <<: *hardened
    image: kayaclaw:0.1                # reuses the bot image (Python + PyYAML baked in)
    user: "0:0"                        # writes the named volume as root
    entrypoint: ["/bin/sh", "/usr/local/bin/extract-allowlist.sh"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - egress-allowlist:/run/shared
    networks:
      - agent-net
    restart: "no"                      # one-shot, must NOT restart on success

  # proxy: filters bot egress by hostname allowlist.
  proxy:
    <<: *hardened
    build: ./tinyproxy
    image: kayaclaw-proxy:0.1
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    networks:
      - agent-net
      - egress-net
    volumes:
      - egress-allowlist:/run/shared:ro
    tmpfs:
      # /etc/tinyproxy must be writable (generate-config.sh renders conf there).
      # NOT at /run, which would mask the /run/shared volume mount above.
      - /etc/tinyproxy:mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev,size=4m
    depends_on:
      init:
        condition: service_completed_successfully
    logging: *logging

  agent:
    <<: *hardened
    build: .
    image: kayaclaw:0.1
    restart: unless-stopped
    environment:
      # Names only for SECRETS. Values come from .env (gitignored).
      # SECURITY.md control 14. See .env.example for the required keys.
      - TELEGRAM_BOT_TOKEN
      - ALLOWED_TELEGRAM_CHAT_IDS      # chat_id, NOT user_id
      # Provider API keys. Forward all three of the documented providers;
      # the agent's startup validation only enforces presence for keys
      # referenced by an active provider in config.yaml.
      - OPENROUTER_API_KEY
      - DEEPINFRA_API_KEY
      - GROQ_API_KEY
      # Config knobs (not secrets). ${VAR:-default} lets .env override.
      - AGENT_DATA_DIR=${AGENT_DATA_DIR:-/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Route all bot HTTP(S) egress through the proxy sidecar. httpx +
      # python-telegram-bot + pydantic-ai's OpenAIProvider all honor these
      # env vars by default. SECURITY.md control 10b.
      - HTTPS_PROXY=http://proxy:8888
      - HTTP_PROXY=http://proxy:8888
    volumes:
      - agent-data:/data                                # control 3
      - ./config.yaml:/config/config.yaml:ro            # control 15
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    networks:
      - agent-net                      # internal: true, no direct external route (control 10b)
    cpus: 1.0                          # control 13
    mem_limit: 512m
    pids_limit: 100
    depends_on:
      init:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    logging: *logging

networks:
  agent-net:
    driver: bridge
    internal: true                     # bot has no direct external route (control 10b)
  egress-net:
    driver: bridge                     # only proxy sits here; has external access
volumes:
  agent-data:                          # survives `docker compose down` (FR-ME2)
  egress-allowlist:                    # shared between init (writer) and proxy (reader)
    driver: local

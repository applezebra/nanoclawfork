# kayaclaw 0.1.6: three-service compose with init (one-shot), proxy (egress
# allowlist sidecar), and agent (the bot). The compose file IS the security
# enforcement point: read-only root FS, dropped capabilities, no-new-privileges,
# explicit mount allowlist, resource limits, AND egress allowlist via the
# proxy sidecar (SECURITY.md control 10b).

# YAML anchors keep the security baseline visually one thing across all three
# services and prevent drift when adding new services later.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # init: one-shot. Walks every configured provider in config.yaml and writes
  # the union of hostnames to /run/shared/egress-allowlist.env on the named
  # volume. Both proxy and agent depend on this completing successfully.
  init:
    <<: *hardened
    image: kayaclaw:0.1                # reuses the bot image (Python + PyYAML baked in)
    user: "0:0"                        # runs as root so it can write the named volume cleanly
    entrypoint: ["/bin/sh", "/usr/local/bin/extract-allowlist.sh"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - egress-allowlist:/run/shared
    networks:
      - agent-net
    restart: "no"                      # critical: one-shot, must NOT restart on success

  # proxy: tinyproxy forward proxy. Sits on BOTH agent-net (so the bot can
  # reach it) AND egress-net (the only network with external access). Bot's
  # HTTPS_PROXY env routes all outbound traffic through here; tinyproxy
  # filters by hostname allowlist (rendered from /run/shared at start).
  proxy:
    <<: *hardened
    build: ./tinyproxy
    image: kayaclaw-proxy:0.1
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    networks:
      - agent-net
      - egress-net
    volumes:
      - egress-allowlist:/run/shared:ro    # read-only mount: proxy never writes here
    tmpfs:
      # Mounted at /etc/tinyproxy (where generate-config.sh writes the
      # rendered conf + filter file). NOT at /run, which would mask the
      # /run/shared volume mount above. mode=0700 + uid=10001 ensures only
      # the proxy user can read/write (defense-in-depth; the container is
      # already non-root and read-only).
      - /etc/tinyproxy:mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev,size=4m
    depends_on:
      init:
        condition: service_completed_successfully
    logging: *logging

  agent:
    <<: *hardened                      # read_only + cap_drop + no-new-privileges (controls 2, 6, 7)
    build: .
    image: kayaclaw:0.1
    restart: unless-stopped
    environment:
      # Names only for SECRETS — values come from .env (gitignored).
      # SECURITY.md control 14. See .env.example for the required keys.
      - TELEGRAM_BOT_TOKEN
      - ALLOWED_TELEGRAM_CHAT_IDS      # eng-review L5 P1-1: chat_id, NOT user_id
      # Provider API keys. Forward all three of the documented providers;
      # the agent's startup validation only enforces presence for keys
      # referenced by an active provider in config.yaml, so unused keys
      # being unset is fine.
      - OPENROUTER_API_KEY
      - DEEPINFRA_API_KEY
      - GROQ_API_KEY
      # Config knobs (not secrets). ${VAR:-default} lets .env override.
      - AGENT_DATA_DIR=${AGENT_DATA_DIR:-/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # v0.1.6: route all bot HTTP(S) egress through the proxy sidecar.
      # httpx + python-telegram-bot + pydantic-ai's OpenAIProvider all
      # honor these env vars by default. SECURITY.md control 10b.
      - HTTPS_PROXY=http://proxy:8888
      - HTTP_PROXY=http://proxy:8888
    volumes:
      - agent-data:/data                                # control 3 (writable scratch via named volume)
      - ./config.yaml:/config/config.yaml:ro            # control 15 (config read-only)
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    networks:
      - agent-net                      # control 11 (no host net); agent-net is internal: true (control 10b)
    cpus: 1.0                          # control 13
    mem_limit: 512m
    pids_limit: 100
    depends_on:
      init:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    logging: *logging

networks:
  agent-net:
    driver: bridge
    internal: true                     # v0.1.6: bot has no direct external route (SECURITY.md control 10b)
  egress-net:
    driver: bridge                     # only proxy sits here; has external access for forwarded requests

volumes:
  agent-data:                          # named volume survives `docker compose down` (FR-ME2)
  egress-allowlist:                    # v0.1.6: shared between init (writer) and proxy (reader)
    driver: local

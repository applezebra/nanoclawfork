# kayaclaw 0.1 — single-service compose. The compose file IS the security
# enforcement point: read-only root FS, dropped capabilities, no-new-privileges,
# explicit mount allowlist, resource limits. All 16 required SECURITY.md
# controls for 0.1 are implemented here or in the Dockerfile.

services:
  agent:
    build: .
    image: kayaclaw:0.1
    restart: unless-stopped
    read_only: true                    # SECURITY.md control 2
    cap_drop: [ALL]                    # SECURITY.md control 6
    security_opt:
      - no-new-privileges:true         # SECURITY.md control 7
    environment:
      # Names only for SECRETS — values come from .env (gitignored).
      # SECURITY.md control 14. See .env.example for the required keys.
      - TELEGRAM_BOT_TOKEN
      - ALLOWED_TELEGRAM_CHAT_IDS      # eng-review L5 P1-1: chat_id, NOT user_id
      # Provider API keys. Forward all three of the documented providers;
      # the agent's startup validation only enforces presence for keys
      # referenced by an active provider in config.yaml, so unused keys
      # being unset is fine.
      - OPENROUTER_API_KEY
      - DEEPINFRA_API_KEY
      - GROQ_API_KEY
      # Config knobs (not secrets) — ${VAR:-default} lets .env override
      # while preserving a sensible default. codex-review L5-Step3 P1: a
      # bare `KEY=value` form would block .env overrides entirely.
      - AGENT_DATA_DIR=${AGENT_DATA_DIR:-/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - agent-data:/data                                # control 3 (writable scratch via named volume)
      - ./config.yaml:/config/config.yaml:ro            # control 15 (config read-only)
    tmpfs:
      # noexec,nosuid,nodev = defense-in-depth (audit P3-2): even with
      # cap_drop ALL + no-new-privileges already preventing setuid escalation,
      # adding these flags blocks a future bug or LLM-tool that downloads a
      # binary into /tmp and tries to exec it. size=64m caps memory-DoS via
      # /tmp fill (default tmpfs size = 50% of host RAM).
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    networks:
      - agent-net                      # control 11 (no host net) — bridge confines, NOT egress allowlist (see SECURITY.md control 10b)
    # Resource limits — TOP-LEVEL keys, NOT under `deploy.resources.limits`.
    # `deploy.*` is Swarm-only and silently ignored by `docker compose up`,
    # which would have left limits as unlimited. codex-review L5-Step3 P1.
    cpus: 1.0                          # control 13
    mem_limit: 512m
    pids_limit: 100
    # Log rotation (audit P2-5): without this, restart: unless-stopped on a
    # bad config crash-loops and fills /var/lib/docker/containers/*/json.log
    # in seconds on a small VPS (Docker default backoff doubles 100ms→1m,
    # so the early window is high-volume). Cap each container at 30MB total.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  agent-net:
    driver: bridge

volumes:
  agent-data:                          # named volume survives `docker compose down` (FR-ME2)

[project]
# RENAME SITE 1 OF 2 — see BRANDING.md
name = "nanoclawfork"
version = "0.0.1"
description = "Container-isolated, LLM-agnostic personal AI agent"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "pydantic-ai>=0.0.13",      # protocol-agnostic agent runtime
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",          # memory store
    "python-telegram-bot>=21",  # first connector
    "structlog>=24.1",          # structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
